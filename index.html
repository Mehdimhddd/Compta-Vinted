<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinted Ledger — Mes bénéfices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-alt:#EFEAE0; --ink:#1E2A23; --ink-soft:#5C6B62;
    --green:#2F6E4F; --green-soft:#E4EFE8; --rust:#B5482E; --rust-soft:#F4E3DD;
    --mustard:#D9A441; --border:#DBD3C0; --card:#FFFDF8;
  }
  [data-theme="dark"]{
    --paper:#171E1A; --paper-alt:#1E2621; --ink:#EFEAE0; --ink-soft:#9AA69D;
    --green:#5FBE8B; --green-soft:#1F332A; --rust:#E08064; --rust-soft:#3A241D;
    --mustard:#E8BB63; --border:#33403A; --card:#1C2420;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(128,128,128,0.08) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 20px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:10px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mustard);display:inline-block;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0;}
  .theme-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;-ms-overflow-style:none;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.03em;
    white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);
    padding:9px 13px;border-radius:999px;cursor:pointer;flex-shrink:0;transition:all .15s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .section{display:none;}
  .section.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
  .card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}

  .stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .stat.hero{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.65;margin-bottom:6px;}
  .stat-value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .stat.hero .stat-value{font-size:26px;}
  .pos{color:var(--green);} .neg{color:var(--rust);}
  .stat.hero .pos{color:#8FD9AE;} .stat.hero .neg{color:#F0A98F;}

  .chart-container { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 10px; margin-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
  .chart-bar { width: 100%; max-width: 30px; background: var(--green); border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.5s ease; }
  .chart-bar.neg { background: var(--rust); }
  .chart-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); }

  .ranking-list{display:flex;flex-direction:column;gap:8px;}
  .ranking-item{display:flex;align-items:center;padding:10px;border-radius:12px;background:var(--paper-alt);gap:12px;}
  .rank-num{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--mustard);width:24px;text-align:center;}
  .rank-info{flex:1;font-size:14px;}
  .rank-profit{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}

  .progress-track{background:var(--paper-alt);border-radius:999px;height:12px;overflow:hidden;margin:12px 0 8px;}
  .progress-fill{height:100%;background:var(--green);border-radius:999px;transition:width .4s ease;}
  .progress-fill.over{background:var(--mustard);}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;border:1px solid var(--border);background:var(--paper);border-radius:9px;padding:9px 10px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-grid.full{grid-template-columns:1fr;}
  .btn{border:none;border-radius:10px;padding:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;transition:opacity .15s ease;}
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--ink);color:var(--paper);width:100%;}
  .btn-success{background:var(--green);color:#fff;width:100%;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);width:100%;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
  .btn-danger{background:var(--rust-soft);color:var(--rust);border:1px solid var(--rust);}
  .btn-row{display:flex;gap:8px;}

  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center;}

  .tag{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px 20px;margin-bottom:14px;}
  .tag::before{content:"absolute";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--cat-color, var(--mustard)); content:"";}
  .tag.expense::before{background:var(--rust);}
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .tag-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .tag-cat{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;}
  .tag-detail{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px;}
  .tag-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:10px;}
  .tag-profit-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;}
  .tag-profit-value{font-family:'Fraunces',serif;font-weight:700;font-size:18px;}
  .tag-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
  .link-btn:hover{color:var(--rust);}
  .link-btn.edit:hover{color:var(--green);}
  .link-btn.dup:hover{color:var(--mustard);}
  .link-btn.sell{color:var(--green);font-weight:600;}

  .empty{text-align:center;padding:34px 20px;color:var(--ink-soft);background:var(--card);border:1px dashed var(--border);border-radius:14px;font-size:13.5px;}

  #toasts{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;}
  .toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;opacity:0;transform:translateY(10px);transition:all .3s ease;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
  .toast.show{opacity:1;transform:translateY(0);}

  /* print area for internal archives */
  #print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; margin:0; padding:20px; background: white !important; color: black !important; font-family: 'Inter', sans-serif;}
    body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="print-area"></div>
<div id="toasts"></div>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Suivi de reventes</div>
      <h1>Vinted Ledger</h1>
      <p class="sub">Ton tableau de bord complet pour tes ventes.</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="Changer de thème">🌙</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn" data-tab="dashboard">📊 Dashboard</button>
    <button class="tab-btn" data-tab="ventes">🏷️ Ventes</button>
    <button class="tab-btn" data-tab="stock">📦 Stock</button>
    <button class="tab-btn" data-tab="commandes">🗂️ Archives / Lots</button>
    <button class="tab-btn" data-tab="frais">💸 Frais</button>
    <button class="tab-btn" data-tab="objectifs">🎯 Objectifs</button>
    <button class="tab-btn" data-tab="outils">🛠️ Outils</button>
  </nav>

  <section class="section" id="tab-dashboard"></section>
  <section class="section" id="tab-ventes"></section>
  <section class="section" id="tab-stock"></section>
  <section class="section" id="tab-commandes"></section>
  <section class="section" id="tab-frais"></section>
  <section class="section" id="tab-objectifs"></section>
  <section class="section" id="tab-outils"></section>
</div>

<script>
/* ---------- CONFIG ---------- */
const CATEGORIES = ['Vêtements femme','Vêtements homme','Enfant','Chaussures','Accessoires','Maison','Autre'];
const PLATEFORMES = ['Vinted', 'Leboncoin', 'Depop', 'Vestiaire Co.', 'Autre'];
const CAT_COLORS = ['#B5482E','#3B6E8F','#D9A441','#7A5C9E','#2F6E4F','#8A8F5C','#6B6B6B'];
const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];

/* ---------- STATE ---------- */
let sales = [];
let stock = [];
let expenses = [];
let settings = { theme: 'light', objectifMensuel: 200, lotSplits: {} };
let loaded = false;
let activeTab = 'dashboard';
let editingSaleId = null;
let editingStockId = null;
let sellingStockId = null; 
let searchVentes = '';

/* ---------- HELPERS ---------- */
const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = (n) => (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fmtPct = (n) => (Math.round((n||0)*10)/10).toLocaleString('fr-FR') + ' %';
const esc = (str) => { const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; };
const catColor = (cat) => { const i = CATEGORIES.indexOf(cat); return CAT_COLORS[i>=0?i:CAT_COLORS.length-1]; };
const profit = (s) => (s.vente||0) - (s.achat||0) - (s.envoi||0) - (s.autres||0);
const monthKey = (dateStr) => dateStr ? dateStr.slice(0,7) : null;

// Gérer la part (pourcentage) de l'utilisateur sur un lot
const getShare = (lotName) => {
  if(!lotName || !settings.lotSplits) return 1;
  const pct = settings.lotSplits[lotName];
  return pct !== undefined ? (pct / 100) : 1;
};
const myProfit = (s) => profit(s) * getShare(s.lot);
const myVente = (s) => (s.vente||0) * getShare(s.lot);

/* ---------- PERSISTENCE ---------- */
function loadAll(){
  try{ const r = localStorage.getItem('vinted-settings-v4'); if(r) settings = Object.assign(settings, JSON.parse(r)); } catch(e){}
  try{ const r = localStorage.getItem('vinted-sales-v4'); if(r) sales = JSON.parse(r); } catch(e){}
  try{ const r = localStorage.getItem('vinted-stock-v4'); if(r) stock = JSON.parse(r); } catch(e){}
  try{ const r = localStorage.getItem('vinted-expenses-v4'); if(r) expenses = JSON.parse(r); } catch(e){}
  
  if(!settings.lotSplits) settings.lotSplits = {};
  if(!settings.objectifMensuel) settings.objectifMensuel = 200;
  
  loaded = true;
  applyTheme(); renderAll();
}
function saveSales(){ localStorage.setItem('vinted-sales-v4', JSON.stringify(sales)); }
function saveStock(){ localStorage.setItem('vinted-stock-v4', JSON.stringify(stock)); }
function saveExpenses(){ localStorage.setItem('vinted-expenses-v4', JSON.stringify(expenses)); }
function saveSettings(){ localStorage.setItem('vinted-settings-v4', JSON.stringify(settings)); }

/* ---------- THEME & TOAST ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = settings.theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveSettings();
});
function showToast(msg){
  const container = document.getElementById('toasts');
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 300); }, 3200);
}

/* ---------- RENDER: DASHBOARD ---------- */
function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  if(!loaded) return;
  
  // Totaux ajustés selon MA PART
  const totalVentes = sales.reduce((a,s)=>a+myVente(s),0);
  const rawProfit = sales.reduce((a,s)=>a+myProfit(s),0);
  const totalExpenses = expenses.reduce((a,e)=>a+e.montant,0);
  const netProfit = rawProfit - totalExpenses; 
  
  // Marge moyenne basée sur la part
  let totalMargin = 0; let marginCount = 0;
  sales.forEach(s => { 
    if(myVente(s) > 0) { totalMargin += (myProfit(s) / myVente(s) * 100); marginCount++; }
  });
  const avgMargin = marginCount ? totalMargin / marginCount : 0;
  
  // Dédoublonnage du Top 5 : on regroupe par nom exact de l'article
  const groupedSales = {};
  sales.forEach(s => {
    const n = s.nom.trim();
    if(!groupedSales[n]) groupedSales[n] = { nom: n, profit: 0, count: 0 };
    groupedSales[n].profit += myProfit(s);
    groupedSales[n].count += 1;
  });
  // Tri par profit total décroissant
  const topSales = Object.values(groupedSales).sort((a,b) => b.profit - a.profit).slice(0, 5);

  // Calcul répartition par plateforme
  const platStats = {};
  sales.forEach(s => {
    if(!platStats[s.plateforme]) platStats[s.plateforme] = 0;
    platStats[s.plateforme] += myProfit(s);
  });
  const platArray = Object.entries(platStats).sort((a,b)=>b[1]-a[1]);

  let chartData = [];
  let maxChartProfit = 1;
  for(let i=5; i>=0; i--){
    let d = new Date(); d.setMonth(d.getMonth() - i);
    let mk = d.toISOString().slice(0,7);
    let mProf = sales.filter(s=>monthKey(s.dateVente)===mk).reduce((a,s)=>a+myProfit(s),0) - expenses.filter(e=>monthKey(e.dateFrais)===mk).reduce((a,e)=>a+e.montant,0);
    chartData.push({ label: MONTHS_FR[d.getMonth()], profit: mProf });
    if(Math.abs(mProf) > maxChartProfit) maxChartProfit = Math.abs(mProf);
  }

  let html = `
    <div class="stats">
      <div class="stat hero">
        <div class="stat-label">Bénéfice Net (Ma Part)</div>
        <div class="stat-value ${netProfit>=0?'pos':'neg'}">${fmt(netProfit)}</div>
      </div>
      <div class="stat"><div class="stat-label">Ventes</div><div class="stat-value">${sales.length}</div></div>
      <div class="stat"><div class="stat-label">Marge moy.</div><div class="stat-value">${sales.length?fmtPct(avgMargin):'—'}</div></div>
    </div>
    
    <div class="card" style="padding-bottom:10px;">
      <p class="card-title">Évolution des bénéfices (6 mois)</p>
      <div class="chart-container">
        ${chartData.map(d => {
          let heightPct = Math.max((Math.abs(d.profit) / maxChartProfit) * 100, 2);
          let isNeg = d.profit < 0;
          return `<div class="chart-bar-wrap">
            <span style="font-size:10px; font-weight:600; color:${isNeg?'var(--rust)':'var(--green)'};">${Math.round(d.profit)}€</span>
            <div class="chart-bar ${isNeg?'neg':''}" style="height:${heightPct}%;"></div>
            <div class="chart-label">${d.label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
      <div class="card" style="margin-bottom:16px;">
        <p class="card-title">🏆 Top Articles</p>
        ${topSales.length === 0 ? `<div class="empty" style="padding:15px;">Vide</div>` : 
        `<div class="ranking-list">` + topSales.map((s, i) => `
            <div class="ranking-item" style="padding:8px; gap:8px;">
              <div class="rank-num" style="font-size:14px; width:16px;">${i+1}</div>
              <div class="rank-info" style="font-size:13px;"><strong>${esc(s.nom)}</strong> ${s.count>1 ? `<span style="font-size:10px; opacity:0.7;">(x${s.count})</span>`:''}</div>
              <div class="rank-profit" style="color:var(--green);font-size:13px;font-weight:bold;">+${fmt(s.profit)}</div>
            </div>
          `).join('') + `</div>`
        }
      </div>
      
      <div class="card" style="margin-bottom:16px;">
        <p class="card-title">📱 Plateformes</p>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${platArray.length ? platArray.map(p => `
            <div style="display:flex; justify-content:space-between; font-size:13px; padding:8px; background:var(--paper-alt); border-radius:8px;">
              <strong>${esc(p[0])}</strong> <span style="color:${p[1]>=0?'var(--green)':'var(--rust)'}; font-weight:bold;">${fmt(p[1])}</span>
            </div>
          `).join('') : '<div class="empty" style="padding:15px;">Vide</div>'}
        </div>
      </div>
    </div>
  `;
  el.innerHTML = html;
}

/* ---------- RENDER: VENTES ---------- */
function saleFormHtml(s, prefix = 'f'){
  s = s || { nom:'', categorie:CATEGORIES[0], plateforme:'Vinted', achat:'', vente:'', envoi:'', autres:'', lot:'', dateVente: todayStr() };
  return `
    <div class="form-grid full">
      <div><label>Article</label><input type="text" id="${prefix}-nom" value="${esc(s.nom)}" placeholder="Ex : Pull Zara"></div>
    </div>
    <div class="form-grid">
      <div><label>Plateforme</label><select id="${prefix}-plat">${PLATEFORMES.map(p=>`<option value="${p}" ${(s.plateforme||'Vinted')===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div><label>Catégorie</label><select id="${prefix}-cat">${CATEGORIES.map(c=>`<option value="${c}" ${s.categorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div><label>Prix d'achat global (€)</label><input type="number" step="0.01" min="0" id="${prefix}-achat" value="${s.achat||''}"></div>
      <div><label>Prix de vente global (€)</label><input type="number" step="0.01" min="0" id="${prefix}-vente" value="${s.vente||''}"></div>
      <div><label>Frais d'envoi globaux (€)</label><input type="number" step="0.01" min="0" id="${prefix}-envoi" value="${s.envoi||''}"></div>
      <div><label>Autres frais globaux (€)</label><input type="number" step="0.01" min="0" id="${prefix}-autres" value="${s.autres||''}"></div>
      <div><label>Date de vente</label><input type="date" id="${prefix}-datevente" value="${s.dateVente||''}"></div>
      <div><label>Réf. Archive / Lot</label><input type="text" id="${prefix}-lot" value="${esc(s.lot||'')}" placeholder="Ex : Lot Friperie #1"></div>
    </div>
  `;
}

function renderVentes(){
  const el = document.getElementById('tab-ventes');
  if(!loaded) return;
  
  let list = sales.slice().sort((a,b)=>(b.dateVente||'').localeCompare(a.dateVente||''));
  if(searchVentes) list = list.filter(s => s.nom.toLowerCase().includes(searchVentes.toLowerCase()) || (s.lot && s.lot.toLowerCase().includes(searchVentes.toLowerCase())));

  el.innerHTML = `
    <div class="card">
      <p class="card-title">Ajouter une vente directe</p>
      ${saleFormHtml(null, 'f')}
      <button class="btn btn-primary" id="addSaleBtn">Ajouter la vente</button>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin:22px 0 12px;">
      <p class="section-title" style="margin:0;"><span>Historique (${list.length})</span></p>

window.promptShare = function(lotName) {
  let currentPct = (settings.lotSplits && settings.lotSplits[lotName] !== undefined) ? settings.lotSplits[lotName] : 100;
  let pct = prompt(`S'il s'agit d'un achat partagé, quel est TON pourcentage sur le lot "${lotName}" ? (ex: 50 pour 50/50)`, currentPct);
  if (pct !== null) {
    let val = parseFloat(pct);
    if (!isNaN(val) && val >= 0 && val <= 100) {
      if (!settings.lotSplits) settings.lotSplits = {};
      settings.lotSplits[lotName] = val;
      saveSettings();
      renderAll();
      showToast('Partage mis à jour');
    } else {
      alert("Veuillez entrer un nombre valide entre 0 et 100.");
    }
  }
}

// JSON IMPORT EXPORT
window.exportJSON = function(){
  const data = { sales, stock, expenses, settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", `vinted_ledger_backup_${todayStr()}.json`);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
window.importJSON = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if(data.sales) { sales = data.sales; saveSales(); }
      if(data.stock) { stock = data.stock; saveStock(); }
      if(data.expenses) { expenses = data.expenses; saveExpenses(); }
      if(data.settings) { settings = data.settings; saveSettings(); }
      alert("Sauvegarde importée avec succès !"); location.reload();
    } catch(err) { alert("Erreur lors de la lecture du fichier JSON."); }
  };
  reader.readAsText(file);
}

// CSV EXPORT
window.exportCSV = function(type) {
  let data = type === 'sales' ? sales : stock;
  if(data.length === 0) return alert("Aucune donnée à exporter.");
  const keys = Object.keys(data[0]).filter(k => k !== 'id');
  let csvContent = keys.join(";") + "\n";
  data.forEach(row => {
    let rowData = keys.map(key => `"${String(row[key] === undefined || row[key] === null ? '' : row[key]).replace(/"/g, '""')}"`);
    csvContent += rowData.join(";") + "\n";
  });
  const blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv;charset=utf-8;' }); 
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", `vinted_ledger_${type}_${todayStr()}.csv`);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
window.resetData = function(){ if(confirm("Attention : cela va effacer absolument toutes vos données. Confirmer ?")){ localStorage.clear(); location.reload(); } }

/* ---------- IMPRESSION FICHE D'ARCHIVE ---------- */
window.printArchiveLot = function(lotName){
  const lotSales = sales.filter(s => s.lot === lotName);
  if(!lotSales.length) return;
  
  const pct = (settings.lotSplits && settings.lotSplits[lotName] !== undefined) ? settings.lotSplits[lotName] : 100;
  const isShared = pct < 100;

  const CA = lotSales.reduce((acc, s) => acc + s.vente, 0);
  const Achats = lotSales.reduce((acc, s) => acc + s.achat, 0);
  const Frais = lotSales.reduce((acc, s) => acc + (s.envoi + s.autres), 0);
  const Benef = CA - Achats - Frais;
  
  // Calculs pour la barre de répartition
  const achatPct = CA > 0 ? Math.max(0, Math.min(100, (Achats / CA) * 100)) : 0;
  const fraisPct = CA > 0 ? Math.max(0, Math.min(100, (Frais / CA) * 100)) : 0;
  const benefPct = CA > 0 && Benef > 0 ? Math.max(0, Math.min(100, (Benef / CA) * 100)) : 0;

  const html = `
    <div style="max-width:800px; margin:0 auto; color:#1E2A23;">
      <div style="border-bottom:3px solid #1E2A23; padding-bottom:20px; margin-bottom:30px; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <h1 style="margin:0; font-size:28px; font-family:'Fraunces', serif; letter-spacing:-0.02em;">FICHE DE RENTABILITÉ</h1>
          <p style="margin:8px 0 0; color:#5C6B62; font-size:16px;">Lot / Réf : <strong>${esc(lotName)}</strong></p>
          <p style="margin:4px 0 0; color:#5C6B62; font-size:13px;">Date d'édition : ${todayStr().split('-').reverse().join('/')}</p>
        </div>
        ${isShared ? `
        <div style="background:#F4E3DD; border:1px solid #B5482E; border-radius:8px; padding:10px 15px; text-align:right;">
          <div style="font-size:11px; text-transform:uppercase; color:#B5482E; font-weight:600;">Lot Partagé</div>
          <div style="font-size:16px; font-family:'Fraunces',serif; font-weight:bold; color:#B5482E;">Ta part : ${pct}%</div>
        </div>
        ` : ''}
      </div>

      <div style="display:flex; justify-content:space-between; gap:15px; margin-bottom:25px;">
        <div style="flex:1; background:#F6F3EC; padding:15px; border-radius:12px; border:1px solid #DBD3C0;">
          <div style="font-size:11px; text-transform:uppercase; color:#5C6B62; letter-spacing:0.05em; margin-bottom:5px;">CA (Global)</div>
          <div style="font-size:22px; font-weight:bold; font-family:'Fraunces',serif;">${fmt(CA)}</div>
        </div>
        <div style="flex:1; background:#F6F3EC; padding:15px; border-radius:12px; border:1px solid #DBD3C0;">
          <div style="font-size:11px; text-transform:uppercase; color:#5C6B62; letter-spacing:0.05em; margin-bottom:5px;">Coûts & Frais (Global)</div>
          <div style="font-size:22px; font-weight:bold; font-family:'Fraunces',serif; color:#B5482E;">${fmt(Achats + Frais)}</div>
        </div>
        <div style="flex:1; background:${Benef>=0?'#E4EFE8':'#F4E3DD'}; padding:15px; border-radius:12px; border:1px solid ${Benef>=0?'#8FD9AE':'#F0A98F'};">
          <div style="font-size:11px; text-transform:uppercase; color:${Benef>=0?'#2F6E4F':'#B5482E'}; letter-spacing:0.05em; margin-bottom:5px;">Bénéfice Net (Global)</div>
          <div style="font-size:22px; font-weight:bold; font-family:'Fraunces',serif; color:${Benef>=0?'#2F6E4F':'#B5482E'};">${fmt(Benef)}</div>
          ${isShared ? `<div style="font-size:12px; margin-top:4px; font-weight:600; color:${Benef>=0?'#2F6E4F':'#B5482E'}; border-top:1px dashed ${Benef>=0?'#8FD9AE':'#F0A98F'}; padding-top:4px;">↳ Ta part: ${fmt(Benef * (pct/100))}</div>` : ''}
        </div>
      </div>

      <div style="margin-bottom:40px;">
        <p style="font-size:13px; font-weight:600; margin:0 0 10px;">Répartition Financière du CA Global :</p>
        <div style="display:flex; width:100%; height:24px; border-radius:12px; overflow:hidden; background:#EFEAE0; border:1px solid #DBD3C0;">
          ${achatPct > 0 ? `<div style="width:${achatPct}%; background:#3B6E8F; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:bold; overflow:hidden;" title="Achats">Achats</div>` : ''}
          ${fraisPct > 0 ? `<div style="width:${fraisPct}%; background:#B5482E; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:bold; overflow:hidden;" title="Frais">Frais</div>` : ''}
          ${benefPct > 0 ? `<div style="width:${benefPct}%; background:#2F6E4F; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:bold; overflow:hidden;" title="Bénéfice">Bénéfice</div>` : ''}
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#5C6B62; margin-top:6px;">
          <span>Investi: ${fmtPct(achatPct)}</span>
          <span>Frais annexe: ${fmtPct(fraisPct)}</span>
          <span style="font-weight:bold; color:${Benef>=0?'#2F6E4F':'#B5482E'}">Marge Nette: ${CA>0?fmtPct((Benef/CA)*100):'0%'}</span>
        </div>
      </div>

      <h3 style="font-size:16px; font-family:'Inter', sans-serif; margin-bottom:10px; border-bottom:1px solid #DBD3C0; padding-bottom:5px;">Détail des articles (${lotSales.length})</h3>
      <table style="width:100%; border-collapse:collapse; font-size:12px;">
        <thead>
          <tr style="text-align:left; color:#5C6B62; background:#F6F3EC;">
            <th style="padding:10px; border-bottom:1px solid #DBD3C0;">Article</th>
            <th style="padding:10px; border-bottom:1px solid #DBD3C0;">Achat</th>
            <th style="padding:10px; border-bottom:1px solid #DBD3C0;">Frais div.</th>
            <th style="padding:10px; border-bottom:1px solid #DBD3C0;">Vente CA</th>
            <th style="padding:10px; border-bottom:1px solid #DBD3C0; text-align:right;">Bénéfice (Global)</th>
          </tr>
        </thead>
        <tbody>
          ${lotSales.map(sale => {
            const p = profit(sale);
            return `
            <tr>
              <td style="padding:10px; border-bottom:1px solid #EFEAE0;"><strong>${esc(sale.nom)}</strong><br><span style="color:#5C6B62; font-size:10px;">${esc(sale.plateforme)} • Vendu le ${sale.dateVente.split('-').reverse().join('/')}</span></td>
              <td style="padding:10px; border-bottom:1px solid #EFEAE0;">${fmt(sale.achat)}</td>
              <td style="padding:10px; border-bottom:1px solid #EFEAE0;">${fmt(sale.envoi + sale.autres)}</td>
              <td style="padding:10px; border-bottom:1px solid #EFEAE0; font-weight:600;">${fmt(sale.vente)}</td>
              <td style="padding:10px; border-bottom:1px solid #EFEAE0; text-align:right; font-weight:bold; color:${p>=0?'#2F6E4F':'#B5482E'};">${fmt(p)}</td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('print-area').innerHTML = html;
  
  // Changement dynamique du titre de la page pour le nom du fichier PDF
  const originalTitle = document.title;
  document.title = `Fiche_Rentabilite_${lotName.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
  window.print();
  document.title = originalTitle;
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.getAttribute('data-tab');

  renderDashboard(); renderVentes(); renderStock(); renderCommandes(); renderFrais(); renderObjectifs(); renderOutils();

}

loadAll();
