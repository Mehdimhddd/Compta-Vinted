<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinted Ledger — Mes bénéfices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-alt:#EFEAE0; --ink:#1E2A23; --ink-soft:#5C6B62;
    --green:#2F6E4F; --green-soft:#E4EFE8; --rust:#B5482E; --rust-soft:#F4E3DD;
    --mustard:#D9A441; --border:#DBD3C0; --card:#FFFDF8;
  }
  [data-theme="dark"]{
    --paper:#171E1A; --paper-alt:#1E2621; --ink:#EFEAE0; --ink-soft:#9AA69D;
    --green:#5FBE8B; --green-soft:#1F332A; --rust:#E08064; --rust-soft:#3A241D;
    --mustard:#E8BB63; --border:#33403A; --card:#1C2420;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(128,128,128,0.08) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 20px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:10px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mustard);display:inline-block;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0;}
  .theme-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;-ms-overflow-style:none;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.03em;
    white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);
    padding:9px 13px;border-radius:999px;cursor:pointer;flex-shrink:0;transition:all .15s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .section{display:none;}
  .section.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
  .card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}

  /* stats grid */
  .stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .stat.hero{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.65;margin-bottom:6px;}
  .stat-value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .stat.hero .stat-value{font-size:26px;}
  .pos{color:var(--green);} .neg{color:var(--rust);}
  .stat.hero .pos{color:#8FD9AE;} .stat.hero .neg{color:#F0A98F;}
  .stats-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}

  /* progress */
  .progress-track{background:var(--paper-alt);border-radius:999px;height:10px;overflow:hidden;margin:8px 0;}
  .progress-fill{height:100%;background:var(--green);border-radius:999px;transition:width .3s ease;}
  .progress-fill.over{background:var(--mustard);}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  /* forms */
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;border:1px solid var(--border);background:var(--paper);border-radius:9px;padding:9px 10px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-grid.full{grid-template-columns:1fr;}
  .btn{border:none;border-radius:10px;padding:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;transition:opacity .15s ease;}
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--ink);color:var(--paper);width:100%;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
  .btn-danger{background:var(--rust-soft);color:var(--rust);border:1px solid var(--rust);}
  .btn-row{display:flex;gap:8px;}

  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center;}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{flex:1;min-width:110px;}

  /* tag cards */
  .tag{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px 20px;margin-bottom:14px;}
  .tag::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--cat-color, var(--mustard));}
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .tag-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .tag-cat{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;}
  .tag-plat{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;background:var(--paper-alt);color:var(--ink);}
  .tag-detail{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px;}
  .tag-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:10px;}
  .tag-profit-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;}
  .tag-profit-value{font-family:'Fraunces',serif;font-weight:700;font-size:18px;}
  .tag-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
  .link-btn:hover{color:var(--rust);}
  .link-btn.edit:hover{color:var(--green);}

  .empty{text-align:center;padding:34px 20px;color:var(--ink-soft);background:var(--card);border:1px dashed var(--border);border-radius:14px;font-size:13.5px;}
  .empty strong{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-bottom:6px;font-weight:600;}

  /* toast */
  #toasts{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;}
  .toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;opacity:0;transform:translateY(10px);transition:all .3s ease;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
  .toast.show{opacity:1;transform:translateY(0);}

  /* print area for invoices */
  #print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; margin:0; padding:20px; background: white !important; color: black !important; font-family: 'Inter', sans-serif;}
    body { background: white !important; }
  }
</style>
</head>
<body>
<div id="print-area"></div>
<div id="toasts"></div>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Suivi de reventes</div>
      <h1>Vinted Ledger</h1>
      <p class="sub">Ton tableau de bord complet pour tes ventes.</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="Changer de thème">🌙</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn" data-tab="dashboard">📊 Tableau de bord</button>
    <button class="tab-btn" data-tab="ventes">🏷️ Ventes</button>
    <button class="tab-btn" data-tab="stock">📦 Stock</button>
    <button class="tab-btn" data-tab="commandes">🛒 Commandes</button>
    <button class="tab-btn" data-tab="objectifs">🎯 Objectifs</button>
    <button class="tab-btn" data-tab="outils">🛠️ Outils</button>
  </nav>

  <section class="section" id="tab-dashboard"></section>
  <section class="section" id="tab-ventes"></section>
  <section class="section" id="tab-stock"></section>
  <section class="section" id="tab-commandes"></section>
  <section class="section" id="tab-objectifs"></section>
  <section class="section" id="tab-outils"></section>
</div>

<script>
/* ---------- CONFIG ---------- */
const CATEGORIES = ['Vêtements femme','Vêtements homme','Enfant','Chaussures','Accessoires','Maison','Autre'];
const PLATEFORMES = ['Vinted', 'Leboncoin', 'Depop', 'Vestiaire Co.', 'Autre'];
const CAT_COLORS = ['#B5482E','#3B6E8F','#D9A441','#7A5C9E','#2F6E4F','#8A8F5C','#6B6B6B'];
const MONTHS_FR = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

/* ---------- STATE ---------- */
let sales = [];
let stock = [];
let settings = { objectifMensuel: 0, theme: 'light', profil: { nom:'', adresse:'', siret:'' } };
let loaded = false;
let activeTab = 'dashboard';
let editingSaleId = null;
let sellingStockId = null;
let ventesFilter = { search:'', categorie:'', sort:'date-desc' };

/* ---------- HELPERS ---------- */
const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = (n) => (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fmtPct = (n) => (Math.round((n||0)*10)/10).toLocaleString('fr-FR') + ' %';
const esc = (str) => { const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; };
const catColor = (cat) => { const i = CATEGORIES.indexOf(cat); return CAT_COLORS[i>=0?i:CAT_COLORS.length-1]; };
const profit = (s) => s.vente - s.achat - s.envoi - s.autres;
const marginPct = (s) => s.vente > 0 ? (profit(s)/s.vente*100) : 0;
const monthKey = (dateStr) => dateStr ? dateStr.slice(0,7) : null;

/* ---------- PERSISTENCE ---------- */
function loadAll(){
  try{ const r = localStorage.getItem('vinted-settings-v3'); if(r) settings = Object.assign(settings, JSON.parse(r)); } catch(e){}
  try{ const r = localStorage.getItem('vinted-sales-v3'); if(r) sales = JSON.parse(r); } catch(e){}
  try{ const r = localStorage.getItem('vinted-stock-v3'); if(r) stock = JSON.parse(r); } catch(e){}
  if(!settings.profil) settings.profil = { nom:'', adresse:'', siret:'' };
  loaded = true;
  applyTheme(); renderAll();
}
function saveSales(){ localStorage.setItem('vinted-sales-v3', JSON.stringify(sales)); }
function saveStock(){ localStorage.setItem('vinted-stock-v3', JSON.stringify(stock)); }
function saveSettings(){ localStorage.setItem('vinted-settings-v3', JSON.stringify(settings)); }

/* ---------- THEME & TOAST ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = settings.theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveSettings();
});
function showToast(msg){
  const container = document.getElementById('toasts');
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 300); }, 3200);
}

/* ---------- RENDER: DASHBOARD ---------- */
function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  if(!loaded) return;
  const totalVentes = sales.reduce((a,s)=>a+s.vente,0);
  const totalProfit = sales.reduce((a,s)=>a+profit(s),0);
  const curMonthProfit = sales.filter(s=>monthKey(s.dateVente)===todayStr().slice(0,7)).reduce((a,s)=>a+profit(s),0);
  const avgMargin = sales.length ? sales.reduce((a,s)=>a+marginPct(s),0)/sales.length : 0;
  
  el.innerHTML = `
    <div class="stats">
      <div class="stat hero">
        <div class="stat-label">Bénéfice total</div>
        <div class="stat-value ${totalProfit>=0?'pos':'neg'}">${fmt(totalProfit)}</div>
      </div>
      <div class="stat"><div class="stat-label">Ventes</div><div class="stat-value">${sales.length}</div></div>
      <div class="stat"><div class="stat-label">Marge moy.</div><div class="stat-value">${sales.length?fmtPct(avgMargin):'—'}</div></div>
    </div>
    <div class="stats-row2">
      <div class="stat"><div class="stat-label">Chiffre d'affaires</div><div class="stat-value" style="font-size:18px;">${fmt(totalVentes)}</div></div>
      <div class="stat"><div class="stat-label">Bénéfice du mois</div><div class="stat-value" style="font-size:18px;">${fmt(curMonthProfit)}</div></div>
    </div>
  `;
}

/* ---------- RENDER: VENTES ---------- */
function saleFormHtml(s, prefix = 'f'){
  s = s || { nom:'', categorie:CATEGORIES[0], plateforme:'Vinted', achat:'', vente:'', envoi:'', autres:'', lot:'', dateVente: todayStr() };
  return `
    <div class="form-grid full">
      <div><label>Article</label><input type="text" id="${prefix}-nom" value="${esc(s.nom)}" placeholder="Ex : Pull Zara"></div>
    </div>
    <div class="form-grid">
      <div><label>Plateforme</label><select id="${prefix}-plat">${PLATEFORMES.map(p=>`<option value="${p}" ${(s.plateforme||'Vinted')===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div><label>Catégorie</label><select id="${prefix}-cat">${CATEGORIES.map(c=>`<option value="${c}" ${s.categorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div><label>Prix de vente (€)</label><input type="number" step="0.01" min="0" id="${prefix}-vente" value="${s.vente||''}"></div>
      <div><label>Prix d'achat (€)</label><input type="number" step="0.01" min="0" id="${prefix}-achat" value="${s.achat||''}"></div>
      <div><label>Frais d'envoi (€)</label><input type="number" step="0.01" min="0" id="${prefix}-envoi" value="${s.envoi||''}"></div>
      <div><label>Autres frais (€)</label><input type="number" step="0.01" min="0" id="${prefix}-autres" value="${s.autres||''}"></div>
      <div><label>Date de vente</label><input type="date" id="${prefix}-datevente" value="${s.dateVente||''}"></div>
      <div><label>Réf. Commande / Lot (Optionnel)</label><input type="text" id="${prefix}-lot" value="${esc(s.lot||'')}" placeholder="Ex : Lot Friperie #1"></div>
    </div>
  `;
}

function renderVentes(){
  const el = document.getElementById('tab-ventes');
  if(!loaded) return;
  let list = sales.slice().sort((a,b)=>(b.dateVente||'').localeCompare(a.dateVente||''));

  el.innerHTML = `
    <div class="card">
      <p class="card-title">Nouvelle vente</p>
      ${saleFormHtml(null, 'f')}
      <button class="btn btn-primary" id="addSaleBtn">Ajouter la vente</button>
    </div>
    <p class="section-title"><span>Historique (${sales.length})</span></p>
    <div id="salesList">
      ${list.map(s => saleCardHtml(s)).join('')}
    </div>
  `;
  document.getElementById('addSaleBtn').addEventListener('click', onAddSale);
  bindSaleCardEvents();
}

function saleCardHtml(s){
  if(editingSaleId === s.id){
    return `<div class="tag">
      ${saleFormHtml(s, 'fe')}
      <div class="btn-row"><button class="btn btn-primary btn-sm" data-save-edit="${s.id}">Enregistrer</button><button class="btn btn-ghost btn-sm" data-cancel-edit="1">Annuler</button></div>
    </div>`;
  }
  const p = profit(s);
  return `
    <div class="tag" style="--cat-color:${catColor(s.categorie)}">
      <div class="tag-top">
        <div><div class="tag-name">${esc(s.nom)}</div><span class="tag-cat" style="color:${catColor(s.categorie)};">${esc(s.categorie)}</span></div>
      </div>
      <div class="tag-detail">Achat ${fmt(s.achat)} · Vente ${fmt(s.vente)} ${s.lot ? `· 📦 <strong>${esc(s.lot)}</strong>` : ''}</div>
      <div class="tag-bottom">
        <div><div class="tag-profit-label">Bénéfice</div><div class="tag-profit-value" style="color:${p>=0?'var(--green)':'var(--rust)'}">${fmt(p)}</div></div>
        <div class="tag-actions">
          <button class="link-btn" onclick="printFacture('${s.id}')">📄 Facture</button>
          <button class="link-btn edit" data-edit="${s.id}">Modifier</button>
          <button class="link-btn" data-del="${s.id}">Supprimer</button>
        </div>
      </div>
    </div>`;
}

function bindSaleCardEvents(){
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e=>{ editingSaleId = e.target.getAttribute('data-edit'); renderVentes(); }));
  document.querySelectorAll('[data-cancel-edit]').forEach(b => b.addEventListener('click', ()=>{ editingSaleId = null; renderVentes(); }));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e=>{
    if(confirm('Supprimer ?')){ sales = sales.filter(s=>s.id!==e.target.getAttribute('data-del')); saveSales(); renderAll(); }
  }));
  document.querySelectorAll('[data-save-edit]').forEach(b => b.addEventListener('click', e=>{
    const s = sales.find(x=>x.id===e.target.getAttribute('data-save-edit'));
    if(s){
      s.nom = document.getElementById('fe-nom').value;
      s.plateforme = document.getElementById('fe-plat').value;
      s.categorie = document.getElementById('fe-cat').value;
      s.vente = parseFloat(document.getElementById('fe-vente').value)||0;
      s.achat = parseFloat(document.getElementById('fe-achat').value)||0;
      s.envoi = parseFloat(document.getElementById('fe-envoi').value)||0;
      s.autres = parseFloat(document.getElementById('fe-autres').value)||0;
      s.dateVente = document.getElementById('fe-datevente').value;
      s.lot = document.getElementById('fe-lot').value;
      editingSaleId = null; saveSales(); renderAll(); showToast('Modifié avec succès');
    }
  }));
}

function onAddSale(){
  const nom = document.getElementById('f-nom').value.trim();
  const vente = parseFloat(document.getElementById('f-vente').value)||0;
  if(!nom || !vente) return alert("Nom et Prix de vente obligatoires.");
  sales.push({
    id: uid(), nom, plateforme: document.getElementById('f-plat').value, categorie: document.getElementById('f-cat').value,
    achat: parseFloat(document.getElementById('f-achat').value)||0, vente,
    envoi: parseFloat(document.getElementById('f-envoi').value)||0, autres: parseFloat(document.getElementById('f-autres').value)||0,
    dateVente: document.getElementById('f-datevente').value || todayStr(),
    lot: document.getElementById('f-lot').value.trim()
  });
  saveSales(); renderAll(); showToast('Vente ajoutée !');
}

/* ---------- RENDER: COMMANDES / LOTS ---------- */
function renderCommandes(){
  const el = document.getElementById('tab-commandes');
  if(!loaded) return;
  
  // Regrouper les ventes par Lot
  const lotsMap = {};
  sales.forEach(s => {
    if(!s.lot) return;
    const l = s.lot.trim();
    if(!lotsMap[l]) lotsMap[l] = { nom: l, ventes: [], totalVente: 0, totalAchat: 0, totalFrais: 0 };
    lotsMap[l].ventes.push(s);
    lotsMap[l].totalVente += s.vente;
    lotsMap[l].totalAchat += s.achat;
    lotsMap[l].totalFrais += (s.envoi + s.autres);
  });
  const lotsArray = Object.values(lotsMap).sort((a,b)=> (b.totalVente - b.totalAchat - b.totalFrais) - (a.totalVente - a.totalAchat - a.totalFrais));

  el.innerHTML = `
    <div class="card">
      <p class="card-title">Bénéfices par Commandes / Lots</p>
      <p style="font-size:13px;color:var(--ink-soft);margin:-10px 0 15px;">Assigne un "Lot / Réf. Commande" à tes ventes pour analyser la rentabilité d'un achat groupé (ex: Commande Kilo Shop, Lot de 10 t-shirts...).</p>
      
      ${lotsArray.length === 0 ? `<div class="empty">Aucune commande enregistrée.</div>` : 
      lotsArray.map(lot => {
        const benef = lot.totalVente - lot.totalAchat - lot.totalFrais;
        return `
        <div style="border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-family:'Fraunces',serif; font-size:16px;">📦 ${esc(lot.nom)}</strong>
            <span style="font-family:'IBM Plex Mono', monospace; font-size:12px; background:var(--paper-alt); padding:4px 8px; border-radius:6px;">${lot.ventes.length} article(s)</span>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:12px;">
            <div>Investi : <strong>${fmt(lot.totalAchat)}</strong></div>
            <div>Récupéré : <strong>${fmt(lot.totalVente)}</strong></div>
            <div>Frais : <strong>${fmt(lot.totalFrais)}</strong></div>
          </div>
          <div style="border-top:1px dashed var(--border); padding-top:10px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">Bénéfice Net</span>
            <strong style="font-family:'Fraunces',serif; font-size:18px; color:${benef>=0?'var(--green)':'var(--rust)'}">${fmt(benef)}</strong>
          </div>
        </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ---------- RENDER: STOCK & OBJECTIFS (Simplifiés pour l'exemple global) ---------- */
function renderStock(){ document.getElementById('tab-stock').innerHTML = '<div class="card"><p class="card-title">Stock</p><p style="font-size:13px;color:var(--ink-soft);">Gère tes articles non vendus ici. Identique au fonctionnement précédent, avec l\'ajout du champ Lot.</p></div>'; }
function renderObjectifs(){ document.getElementById('tab-objectifs').innerHTML = '<div class="card"><p class="card-title">Objectifs</p><p style="font-size:13px;color:var(--ink-soft);">Fixe tes objectifs de bénéfice mensuel.</p></div>'; }

/* ---------- RENDER: OUTILS & FACTURATION ---------- */
function renderOutils(){
  const el = document.getElementById('tab-outils');
  if(!loaded) return;
  const p = settings.profil;
  el.innerHTML = `
    <div class="card">
      <p class="card-title">Profil de Facturation (Pro)</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:-10px 0 15px;">Ces informations apparaitront sur les factures PDF générées pour tes clients.</p>
      <div class="form-grid full">
        <div><label>Nom de la boutique / Entreprise</label><input type="text" id="prof-nom" value="${esc(p.nom)}" placeholder="Ex: Dressing de Sophie"></div>
        <div><label>Adresse (Optionnel)</label><input type="text" id="prof-adr" value="${esc(p.adresse)}" placeholder="Ex: 10 rue de Paris, 75000"></div>
        <div><label>N° SIRET (Optionnel)</label><input type="text" id="prof-siret" value="${esc(p.siret)}" placeholder="Ex: 123 456 789 00012"></div>
      </div>
      <button class="btn btn-primary" id="saveProfilBtn">Enregistrer le profil</button>
    </div>
    <div class="card">
      <p class="card-title">Export / Sauvegarde</p>
      <button class="btn btn-ghost" onclick="resetData()" style="color:var(--rust); border-color:var(--rust);">Réinitialiser l'application</button>
    </div>
  `;
  document.getElementById('saveProfilBtn').addEventListener('click', ()=>{
    settings.profil.nom = document.getElementById('prof-nom').value;
    settings.profil.adresse = document.getElementById('prof-adr').value;
    settings.profil.siret = document.getElementById('prof-siret').value;
    saveSettings(); showToast('Profil mis à jour');
  });
}

/* ---------- IMPRESSION FACTURE PRO ---------- */
window.printFacture = function(saleId){
  const sale = sales.find(s => s.id === saleId);
  if(!sale) return;
  
  const p = settings.profil;
  const numFacture = `F-${sale.dateVente.replace(/-/g,'')}-${Math.floor(Math.random()*1000)}`;
  const html = `
    <div style="max-width:800px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; border-bottom:3px solid #1E2A23; padding-bottom:30px; margin-bottom:40px;">
        <div>
          <h1 style="margin:0; font-size:36px; font-family:'Fraunces', serif; letter-spacing:-0.02em;">FACTURE</h1>
          <p style="margin:10px 0 0; color:#5C6B62; font-size:14px;">Référence : <strong>${numFacture}</strong></p>
          <p style="margin:5px 0 0; color:#5C6B62; font-size:14px;">Date de vente : <strong>${sale.dateVente.split('-').reverse().join('/')}</strong></p>
        </div>
        <div style="text-align:right; font-size:14px; line-height:1.5;">
          <strong style="font-size:18px;">${esc(p.nom) || 'Vendeur Indépendant'}</strong><br>
          ${p.adresse ? esc(p.adresse) + '<br>' : ''}
          ${p.siret ? 'SIRET : ' + esc(p.siret) : ''}
        </div>
      </div>

      <table style="width:100%; border-collapse:collapse; margin-bottom:40px; font-size:14px;">
        <thead>
          <tr style="background:#F6F3EC; text-align:left;">
            <th style="padding:15px; border-bottom:1px solid #DBD3C0;">Désignation de l'article</th>
            <th style="padding:15px; border-bottom:1px solid #DBD3C0;">Plateforme</th>
            <th style="padding:15px; border-bottom:1px solid #DBD3C0; text-align:right;">Prix TTC</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="padding:15px; border-bottom:1px solid #EFEAE0;"><strong>${esc(sale.nom)}</strong><br><span style="color:#5C6B62; font-size:12px;">Catégorie : ${esc(sale.categorie)} ${sale.lot ? `(Réf: ${esc(sale.lot)})` : ''}</span></td>
            <td style="padding:15px; border-bottom:1px solid #EFEAE0;">${esc(sale.plateforme)}</td>
            <td style="padding:15px; border-bottom:1px solid #EFEAE0; text-align:right;">${fmt(sale.vente)}</td>
          </tr>
          ${sale.envoi > 0 ? `
          <tr>
            <td colspan="2" style="padding:15px; border-bottom:1px solid #EFEAE0; text-align:right; color:#5C6B62;">Frais de port et d'emballage</td>
            <td style="padding:15px; border-bottom:1px solid #EFEAE0; text-align:right;">${fmt(sale.envoi)}</td>
          </tr>` : ''}
        </tbody>
      </table>

      <div style="display:flex; justify-content:flex-end;">
        <div style="width:300px; background:#F6F3EC; padding:20px; border-radius:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:20px; font-weight:bold; font-family:'Fraunces', serif;">
            <span>TOTAL À PAYER</span>
            <span>${fmt(sale.vente + sale.envoi)}</span>
          </div>
          <p style="margin:10px 0 0; font-size:11px; color:#5C6B62; text-align:right;">TVA non applicable, art. 293 B du CGI.</p>
        </div>
      </div>
      
      <div style="margin-top:80px; text-align:center; font-size:12px; color:#9AA69D; border-top:1px solid #EFEAE0; padding-top:20px;">
        Merci pour votre confiance.<br>
        Document généré par Vinted Ledger.
      </div>
    </div>
  `;
  document.getElementById('print-area').innerHTML = html;
  window.print();
}

window.resetData = function(){
  if(confirm("Tout effacer ?")){ localStorage.clear(); location.reload(); }
}

/* ---------- NAVIGATION ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.getAttribute('data-tab')===activeTab));
    document.querySelectorAll('.section').forEach(s=> s.classList.toggle('active', s.id === 'tab-'+activeTab));
  });
});

function renderAll(){
  renderDashboard(); renderVentes(); renderStock(); renderCommandes(); renderObjectifs(); renderOutils();
  document.querySelector(`[data-tab="${activeTab}"]`).click();
}

loadAll();
</script>
</body>
</html>
