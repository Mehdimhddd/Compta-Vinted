<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinted Ledger — Mes bénéfices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC; --paper-alt:#EFEAE0; --ink:#1E2A23; --ink-soft:#5C6B62;
    --green:#2F6E4F; --green-soft:#E4EFE8; --rust:#B5482E; --rust-soft:#F4E3DD;
    --mustard:#D9A441; --border:#DBD3C0; --card:#FFFDF8;
  }
  [data-theme="dark"]{
    --paper:#171E1A; --paper-alt:#1E2621; --ink:#EFEAE0; --ink-soft:#9AA69D;
    --green:#5FBE8B; --green-soft:#1F332A; --rust:#E08064; --rust-soft:#3A241D;
    --mustard:#E8BB63; --border:#33403A; --card:#1C2420;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(128,128,128,0.08) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 20px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:10px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mustard);display:inline-block;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0;}
  .theme-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;-ms-overflow-style:none;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.03em;
    white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);
    padding:9px 13px;border-radius:999px;cursor:pointer;flex-shrink:0;transition:all .15s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .section{display:none;}
  .section.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
  .card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}

  /* stats grid */
  .stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .stat.hero{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.65;margin-bottom:6px;}
  .stat-value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .stat.hero .stat-value{font-size:26px;}
  .pos{color:var(--green);} .neg{color:var(--rust);}
  .stat.hero .pos{color:#8FD9AE;} .stat.hero .neg{color:#F0A98F;}
  .stats-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}

  /* progress */
  .progress-track{background:var(--paper-alt);border-radius:999px;height:10px;overflow:hidden;margin:8px 0;}
  .progress-fill{height:100%;background:var(--green);border-radius:999px;transition:width .3s ease;}
  .progress-fill.over{background:var(--mustard);}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  /* bar chart */
  .barchart{display:flex;align-items:flex-end;gap:8px;height:110px;margin:10px 0 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;border-radius:5px 5px 2px 2px;min-height:3px;transition:height .3s ease;}
  .bar-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);margin-top:6px;}
  .bar-val{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-soft);margin-bottom:3px;}

  /* category breakdown */
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .cat-name{width:110px;flex-shrink:0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .cat-bar-track{flex:1;background:var(--paper-alt);border-radius:6px;height:16px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:6px;}
  .cat-val{width:64px;text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}

  /* forms */
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;border:1px solid var(--border);background:var(--paper);border-radius:9px;padding:9px 10px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-grid.full{grid-template-columns:1fr;}
  .btn{border:none;border-radius:10px;padding:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;transition:opacity .15s ease;}
  .btn:hover{opacity:0.88;}
  .btn-primary{background:var(--ink);color:var(--paper);width:100%;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
  .btn-danger{background:var(--rust-soft);color:var(--rust);border:1px solid var(--rust);}
  .btn-row{display:flex;gap:8px;}

  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center;}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{flex:1;min-width:110px;}

  /* tag cards */
  .tag{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px 20px;margin-bottom:14px;}
  .tag::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--cat-color, var(--mustard));}
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .tag-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .tag-cat{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;}
  .tag-detail{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px;}
  .tag-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:10px;}
  .tag-profit-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;}
  .tag-profit-value{font-family:'Fraunces',serif;font-weight:700;font-size:18px;}
  .tag-actions{display:flex;gap:12px;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
  .link-btn:hover{color:var(--rust);}
  .link-btn.edit:hover{color:var(--green);}

  .empty{text-align:center;padding:34px 20px;color:var(--ink-soft);background:var(--card);border:1px dashed var(--border);border-radius:14px;font-size:13.5px;}
  .empty strong{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-bottom:6px;font-weight:600;}

  /* badges */
  .badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .badge{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card);text-align:center;}
  .badge.locked{opacity:0.4;}
  .badge-emoji{font-size:26px;display:block;margin-bottom:6px;}
  .badge-title{font-family:'Fraunces',serif;font-weight:600;font-size:13px;margin-bottom:3px;}
  .badge-desc{font-size:10.5px;color:var(--ink-soft);line-height:1.3;}

  /* quote */
  .quote-box{background:var(--green-soft);border:1px solid var(--green);border-radius:14px;padding:16px;font-family:'Fraunces',serif;font-style:italic;font-size:14.5px;color:var(--ink);margin-bottom:8px;}

  /* toast */
  #toasts{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;}
  .toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;opacity:0;transform:translateY(10px);transition:all .3s ease;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
  .toast.show{opacity:1;transform:translateY(0);}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70;}
  .confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0.3;}}

  .goal-input-row{display:flex;gap:8px;align-items:flex-end;}
  .goal-input-row .field{flex:1;}

  .stock-days{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--paper-alt);color:var(--ink-soft);}
  .stock-days.warn{background:var(--rust-soft);color:var(--rust);}

  footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:30px;font-family:'IBM Plex Mono',monospace;}

  @media (max-width:420px){
    .stats{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .badge-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="confetti"></div>
<div id="toasts"></div>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Suivi de reventes</div>
      <h1>Vinted Ledger</h1>
      <p class="sub">Ton tableau de bord complet pour tes ventes.</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="Changer de thème">🌙</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn" data-tab="dashboard">📊 Tableau de bord</button>
    <button class="tab-btn" data-tab="ventes">🏷️ Ventes</button>
    <button class="tab-btn" data-tab="stock">📦 Stock</button>
    <button class="tab-btn" data-tab="objectifs">🎯 Objectifs</button>
    <button class="tab-btn" data-tab="badges">🏅 Badges</button>
    <button class="tab-btn" data-tab="outils">🛠️ Outils</button>
  </nav>

  <section class="section" id="tab-dashboard"></section>
  <section class="section" id="tab-ventes"></section>
  <section class="section" id="tab-stock"></section>
  <section class="section" id="tab-objectifs"></section>
  <section class="section" id="tab-badges"></section>
  <section class="section" id="tab-outils"></section>

  <footer>100% gratuit · tes données restent dans cette appli</footer>
</div>

<script>
/* ---------- CONFIG ---------- */
const CATEGORIES = ['Vêtements femme','Vêtements homme','Enfant','Chaussures','Accessoires','Maison','Autre'];
const CAT_COLORS = ['#B5482E','#3B6E8F','#D9A441','#7A5C9E','#2F6E4F','#8A8F5C','#6B6B6B'];
const MONTHS_FR = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const QUOTES = [
  "Chaque pièce vendue est une place gagnée dans ton dressing.",
  "Le meilleur prix est celui que quelqu'un est prêt à payer aujourd'hui.",
  "Une photo nette vaut mille descriptions.",
  "Ranger, photographier, publier : la routine qui rapporte.",
  "Le vide-dressing d'aujourd'hui finance les envies de demain.",
  "Un article qui dort ne rapporte rien : baisse, bouge ou boost.",
  "La régularité bat la perfection sur Vinted.",
  "Ton bénéfice n'est pas le prix de vente, ne l'oublie jamais.",
  "Dix petites ventes valent souvent mieux qu'une grosse attente.",
  "La meilleure pub, c'est un profil propre et des réponses rapides."
];

/* ---------- STATE ---------- */
let sales = [];
let stock = [];
let settings = { objectifMensuel: 0, theme: 'light', unlockedBadges: [], celebratedMonths: [] };
let loaded = false;
let activeTab = 'dashboard';
let editingSaleId = null;
let editingStockId = null;
let sellingStockId = null;
let ventesFilter = { search:'', categorie:'', sort:'date-desc' };
let quoteIndex = 0;

/* ---------- HELPERS ---------- */
const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = (n) => (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fmtPct = (n) => (Math.round((n||0)*10)/10).toLocaleString('fr-FR') + ' %';
const esc = (str) => { const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; };
const catColor = (cat) => { const i = CATEGORIES.indexOf(cat); return CAT_COLORS[i>=0?i:CAT_COLORS.length-1]; };
const profit = (s) => s.vente - s.achat - s.envoi - s.autres;
const marginPct = (s) => s.vente > 0 ? (profit(s)/s.vente*100) : 0;
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const monthKey = (dateStr) => dateStr ? dateStr.slice(0,7) : null;
const monthLabel = (key) => { const [y,m] = key.split('-'); return MONTHS_FR[parseInt(m,10)-1] + ' ' + y.slice(2); };

/* ---------- PERSISTENCE ---------- */
async function loadAll(){
  try{ const r = await window.storage.get('vinted-settings-v2', false); if(r && r.value) settings = Object.assign(settings, JSON.parse(r.value)); }catch(e){}
  try{
    const r = await window.storage.get('vinted-sales-v2', false);
    if(r && r.value) sales = JSON.parse(r.value); else await migrateLegacy();
  }catch(e){ await migrateLegacy(); }
  try{ const r = await window.storage.get('vinted-stock-v2', false); if(r && r.value) stock = JSON.parse(r.value); }catch(e){}
  loaded = true;
  applyTheme();
  renderAll();
}
async function migrateLegacy(){
  try{
    const r = await window.storage.get('vinted-sales', false);
    if(r && r.value){
      const old = JSON.parse(r.value);
      if(Array.isArray(old) && old.length){
        sales = old.map(s => ({
          id: uid(), nom: s.nom || 'Article', categorie: 'Autre',
          achat: s.achat||0, vente: s.vente||0, envoi: s.envoi||0, autres: s.autres||0,
          dateMiseEnLigne: null, dateVente: s.date ? s.date.slice(0,10) : todayStr()
        }));
        await saveSales();
      }
    }
  }catch(e){}
}
async function saveSales(){ try{ await window.storage.set('vinted-sales-v2', JSON.stringify(sales), false); }catch(e){ console.error(e); } }
async function saveStock(){ try{ await window.storage.set('vinted-stock-v2', JSON.stringify(stock), false); }catch(e){ console.error(e); } }
async function saveSettings(){ try{ await window.storage.set('vinted-settings-v2', JSON.stringify(settings), false); }catch(e){ console.error(e); } }

/* ---------- THEME ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = settings.theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', async ()=>{
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  await saveSettings();
});

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.getAttribute('data-tab');
    showActiveTab();
  });
});
function showActiveTab(){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.getAttribute('data-tab')===activeTab));
  document.querySelectorAll('.section').forEach(s=> s.classList.toggle('active', s.id === 'tab-'+activeTab));
}

/* ---------- TOASTS & CONFETTI ---------- */
function showToast(msg){
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 300); }, 3200);
}
function launchConfetti(){
  const container = document.getElementById('confetti');
  const colors = ['#2F6E4F','#B5482E','#D9A441','#3B6E8F','#7A5C9E'];
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + '%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.3) + 's';
    p.style.animationDuration = (1.3 + Math.random()*0.9) + 's';
    container.appendChild(p);
    setTimeout(()=> p.remove(), 2500);
  }
}

/* ---------- CALCULATIONS ---------- */
function totals(){
  const totalVentes = sales.reduce((a,s)=>a+s.vente,0);
  const totalCouts = sales.reduce((a,s)=>a+s.achat+s.envoi+s.autres,0);
  const totalProfit = totalVentes - totalCouts;
  const n = sales.length;
  const avgMargin = n ? sales.reduce((a,s)=>a+marginPct(s),0)/n : 0;
  const withDates = sales.filter(s=>s.dateMiseEnLigne && s.dateVente);
  const avgDays = withDates.length ? Math.round(withDates.reduce((a,s)=>a+daysBetween(s.dateMiseEnLigne,s.dateVente),0)/withDates.length) : null;
  return { totalVentes, totalCouts, totalProfit, n, avgMargin, avgDays };
}
function last6MonthsData(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return months.map(key => ({ key, val: sales.filter(s=>monthKey(s.dateVente)===key).reduce((a,s)=>a+profit(s),0) }));
}
function categoryBreakdown(){
  const map = {};
  sales.forEach(s => { map[s.categorie] = (map[s.categorie]||0) + profit(s); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function currentMonthProfit(){
  const key = todayStr().slice(0,7);
  return sales.filter(s=>monthKey(s.dateVente)===key).reduce((a,s)=>a+profit(s),0);
}
function hasThreeConsecutiveMonths(){
  const keys = Array.from(new Set(sales.map(s=>monthKey(s.dateVente)).filter(Boolean))).sort();
  if(keys.length < 3) return false;
  const nums = keys.map(k=>{ const [y,m]=k.split('-').map(Number); return y*12+m; }).sort((a,b)=>a-b);
  let run = 1;
  for(let i=1;i<nums.length;i++){
    run = nums[i]===nums[i-1]+1 ? run+1 : 1;
    if(run>=3) return true;
  }
  return false;
}
function monthsReachingGoal(goal){
  const map = {};
  sales.forEach(s=>{ const k=monthKey(s.dateVente); if(!k) return; map[k]=(map[k]||0)+profit(s); });
  return Object.entries(map).filter(([k,v])=> v>=goal);
}

/* ---------- BADGES ---------- */
const BADGES = [
  { id:'first', emoji:'🎉', title:'Première vente', desc:'Vends ton premier article', check:t=>t.n>=1 },
  { id:'ten', emoji:'🔥', title:'10 ventes', desc:'Vends 10 articles', check:t=>t.n>=10 },
  { id:'fifty', emoji:'🏆', title:'50 ventes', desc:'Vends 50 articles', check:t=>t.n>=50 },
  { id:'hundred', emoji:'👑', title:'100 ventes', desc:'Vends 100 articles', check:t=>t.n>=100 },
  { id:'profit100', emoji:'💶', title:'100€ cumulés', desc:'Atteins 100€ de bénéfice total', check:t=>t.totalProfit>=100 },
  { id:'profit500', emoji:'💰', title:'500€ cumulés', desc:'Atteins 500€ de bénéfice total', check:t=>t.totalProfit>=500 },
  { id:'profit1000', emoji:'🤑', title:'1000€ cumulés', desc:'Atteins 1000€ de bénéfice total', check:t=>t.totalProfit>=1000 },
  { id:'flash', emoji:'⚡', title:'Vente éclair', desc:'Vends le jour même de la mise en ligne', check:()=> sales.some(s=>s.dateMiseEnLigne && s.dateVente && daysBetween(s.dateMiseEnLigne,s.dateVente)===0) },
  { id:'goldmargin', emoji:'✨', title:"Marge d'or", desc:'Atteins 70% de marge sur une vente', check:()=> sales.some(s=>marginPct(s)>=70) },
  { id:'collector', emoji:'🎨', title:'Collectionneur', desc:'Vends dans 5 catégories différentes', check:()=> new Set(sales.map(s=>s.categorie)).size>=5 },
  { id:'regular', emoji:'📅', title:'Régulier', desc:'Vends sur 3 mois consécutifs', check:()=> hasThreeConsecutiveMonths() },
  { id:'goal', emoji:'🎯', title:'Objectif atteint', desc:'Atteins ton objectif mensuel', check:()=> settings.objectifMensuel>0 && monthsReachingGoal(settings.objectifMensuel).length>0 },
];
function evaluateBadges(){ const t = totals(); return BADGES.map(b => ({ ...b, unlocked: b.check(t) })); }
async function checkBadgesAndCelebrate(){
  const evaluated = evaluateBadges();
  const fresh = evaluated.filter(b => b.unlocked && !settings.unlockedBadges.includes(b.id));
  let changed = false;
  if(fresh.length){
    fresh.forEach(b => { settings.unlockedBadges.push(b.id); showToast(b.emoji + ' Badge débloqué : ' + b.title); });
    launchConfetti();
    changed = true;
  }
  if(settings.objectifMensuel > 0){
    const key = todayStr().slice(0,7);
    if(currentMonthProfit() >= settings.objectifMensuel && !settings.celebratedMonths.includes(key)){
      settings.celebratedMonths.push(key);
      showToast('🎯 Objectif du mois atteint !');
      launchConfetti();
      changed = true;
    }
  }
  if(changed) await saveSettings();
}

    s.dateMiseEnLigne = document.getElementById('fe-datemel').value || null;
    editingSaleId = null;
    await saveSales();

function renderObjectifs(){
  const el = document.getElementById('tab-objectifs');
  if(!loaded){ el.innerHTML = '<div class="empty">Chargement…</div>'; return; }
  const goal = settings.objectifMensuel;
  const cur = currentMonthProfit();
  const pct = goal>0 ? Math.min(100, Math.round(cur/goal*100)) : 0;
  const remaining = Math.max(0, goal - cur);
  const soldSales = sales.filter(s=>profit(s)>0);
  const avgProfitPerSale = soldSales.length ? soldSales.reduce((a,s)=>a+profit(s),0)/soldSales.length : 0;
  const salesNeeded = (goal>0 && avgProfitPerSale>0) ? Math.ceil(remaining/avgProfitPerSale) : null;

  const map = {};
  sales.forEach(s=>{ const k=monthKey(s.dateVente); if(!k) return; map[k]=(map[k]||0)+profit(s); });
  const monthHistory = Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

  el.innerHTML = `
    <div class="card">
      <p class="card-title">Objectif mensuel</p>

        <div class="field"><label>Montant (€)</label><input type="number" step="1" min="0" id="goalInput" value="${goal||''}" placeholder="Ex : 150"></div>

      </div>
    </div>

    ${goal>0 ? `
    <div class="card">
      <p class="card-title">Ce mois-ci <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);">${pct}%</span></p>
      <div class="progress-track"><div class="progress-fill ${cur>=goal?'over':''}" style="width:${pct}%;"></div></div>
      <div class="progress-meta"><span>${fmt(cur)}</span><span>Objectif ${fmt(goal)}</span></div>
      ${cur>=goal ? `<p style="color:var(--green);font-size:13px;margin:10px 0 0;font-weight:600;">🎯 Objectif atteint, bravo !</p>` :
        `<p style="font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;">Il te reste ${fmt(remaining)} à réaliser${salesNeeded!=null ? `, soit environ ${salesNeeded} vente${salesNeeded>1?'s':''} à ta marge moyenne actuelle.` : '.'}</p>`}
    </div>` : `<div class="card"><p style="font-size:13px;color:var(--ink-soft);margin:0;">Définis un objectif ci-dessus pour suivre ta progression et débloquer le badge 🎯.</p></div>`}

    <p class="section-title"><span>Historique par mois</span></p>
    ${monthHistory.length===0 ? '<div class="empty"><strong>Rien à afficher</strong>Ajoute des ventes pour voir ton historique mensuel.</div>' :
      monthHistory.map(([k,v])=>{
        const reached = goal>0 && v>=goal;
        return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);">${monthLabel(k)}</span>
          <span style="font-family:'Fraunces',serif;font-weight:600;color:${v>=0?'var(--green)':'var(--rust)'}">${fmt(v)}</span>
          <span>${goal>0 ? (reached?'✅':'—') : ''}</span>
        </div>`;
      }).join('')}
  `;
  document.getElementById('saveGoalBtn').addEventListener('click', async ()=>{
    settings.objectifMensuel = parseFloat(document.getElementById('goalInput').value) || 0;
    await saveSettings();
    renderAll();
    await checkBadgesAndCelebrate();
  });
}

/* ---------- RENDER: BADGES ---------- */
function renderBadges(){
  const el = document.getElementById('tab-badges');
  if(!loaded){ el.innerHTML = '<div class="empty">Chargement…</div>'; return; }
  const evaluated = evaluateBadges();
  const unlocked = evaluated.filter(b=>b.unlocked).length;
  el.innerHTML = `
    <div class="card" style="text-align:center;">
      <p class="card-title" style="justify-content:center;">🏅 ${unlocked} / ${evaluated.length} débloqués</p>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(unlocked/evaluated.length*100)}%;"></div></div>
    </div>
    <div class="badge-grid">
      ${evaluated.map(b => `
        <div class="badge ${b.unlocked?'':'locked'}">
          <span class="badge-emoji">${b.unlocked ? b.emoji : '🔒'}</span>
          <div class="badge-title">${b.title}</div>
          <div class="badge-desc">${b.desc}</div>
        </div>`).join('')}
    </div>
  `;
}

/* ---------- RENDER: OUTILS ---------- */
function renderOutils(){
  const el = document.getElementById('tab-outils');
  if(!loaded){ el.innerHTML = '<div class="empty">Chargement…</div>'; return; }
  el.innerHTML = `
    <div class="card">
      <p class="card-title">Calculatrice rapide</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:-8px 0 12px;">Ce calcul n'est pas enregistré, il te donne juste une estimation.</p>
      <div class="form-grid">
        <div><label>Prix d'achat (€)</label><input type="number" step="0.01" min="0" id="calc-achat"></div>
        <div><label>Prix de vente (€)</label><input type="number" step="0.01" min="0" id="calc-vente"></div>
        <div><label>Frais d'envoi (€)</label><input type="number" step="0.01" min="0" id="calc-envoi"></div>
        <div><label>Autres frais (€)</label><input type="number" step="0.01" min="0" id="calc-autres"></div>
      </div>
      <div id="calc-result" style="text-align:center;padding:14px;background:var(--paper-alt);border-radius:12px;">
        <div class="stat-label">Bénéfice estimé</div>
        <div class="stat-value" id="calc-profit">0,00 €</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;" id="calc-margin">Marge : 0 %</div>
      </div>
    </div>

    <div class="card">
      <p class="card-title">💬 Citation du jour</p>
      <div class="quote-box" id="quoteBox">${QUOTES[quoteIndex]}</div>
      <button class="btn btn-ghost btn-sm" id="newQuoteBtn">Nouvelle citation</button>
    </div>

    <div class="card">
      <p class="card-title">Export</p>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-ghost" id="exportCsvBtn">Exporter en CSV</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="exportJsonBtn">Sauvegarder (JSON)</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Import</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Restaure une sauvegarde JSON précédemment exportée.</p>
      <input type="file" id="importFile" accept="application/json">
    </div>

    <div class="card">
      <p class="card-title">Zone danger</p>
      <button class="btn btn-danger" id="resetBtn">Réinitialiser toutes les données</button>
    </div>
  `;

  const calcInputs = ['calc-achat','calc-vente','calc-envoi','calc-autres'];
  const updateCalc = ()=>{
    const achat = parseFloat(document.getElementById('calc-achat').value) || 0;
    const vente = parseFloat(document.getElementById('calc-vente').value) || 0;
    const envoi = parseFloat(document.getElementById('calc-envoi').value) || 0;
    const autres = parseFloat(document.getElementById('calc-autres').value) || 0;
    const p = vente - achat - envoi - autres;
    const m = vente>0 ? p/vente*100 : 0;
    const pEl = document.getElementById('calc-profit');
    pEl.textContent = fmt(p);
    pEl.style.color = p>=0 ? 'var(--green)' : 'var(--rust)';
    document.getElementById('calc-margin').textContent = 'Marge : ' + fmtPct(m);
  };
  calcInputs.forEach(id => document.getElementById(id).addEventListener('input', updateCalc));

  document.getElementById('newQuoteBtn').addEventListener('click', ()=>{
    let next = quoteIndex;
    while(next === quoteIndex && QUOTES.length>1) next = Math.floor(Math.random()*QUOTES.length);
    quoteIndex = next;
    document.getElementById('quoteBox').textContent = QUOTES[quoteIndex];
  });

  document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
  document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
  document.getElementById('importFile').addEventListener('change', importJson);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
}

function exportCsv(){
  const header = ['Nom','Categorie','Achat','Vente','Envoi','Autres','Benefice','DateMiseEnLigne','DateVente'];
  const rows = sales.map(s => [s.nom, s.categorie, s.achat, s.vente, s.envoi, s.autres, profit(s).toFixed(2), s.dateMiseEnLigne||'', s.dateVente||'']);
  const csv = [header.join(';'), ...rows.map(r => r.map(v => String(v).replace(/;/g,',')).join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ventes-vinted.csv';
  a.click();
}
function exportJson(){
  const data = { sales, stock, settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vinted-backup.json';
  a.click();
}
async function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data.sales)) throw new Error('Format invalide');
    sales = data.sales;
    stock = Array.isArray(data.stock) ? data.stock : [];
    settings = Object.assign(settings, data.settings || {});
    await saveSales(); await saveStock(); await saveSettings();
    applyTheme();
    renderAll();
    showToast('✅ Sauvegarde importée');
  }catch(err){
    alert("Fichier invalide, impossible d'importer cette sauvegarde.");
  }
  e.target.value = '';
}
async function resetAll(){
  if(!confirm('Cette action supprime définitivement toutes tes ventes, ton stock et tes réglages. Continuer ?')) return;
  sales = []; stock = [];
  settings = { objectifMensuel: 0, theme: settings.theme, unlockedBadges: [], celebratedMonths: [] };
  try{ await window.storage.delete('vinted-sales-v2', false); }catch(e){}
  try{ await window.storage.delete('vinted-stock-v2', false); }catch(e){}
  try{ await window.storage.set('vinted-settings-v2', JSON.stringify(settings), false); }catch(e){}
  renderAll();
  showToast('Toutes les données ont été réinitialisées');
}

/* ---------- RENDER ALL ---------- */
function renderAll(){
  renderDashboard();
  renderVentes();
  renderStock();
  renderObjectifs();
  renderBadges();
  renderOutils();
  showActiveTab();
}

loadAll();
</script>
</body>
</html>
